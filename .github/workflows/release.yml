# Anexa module.json e trilha-viva.zip à release.
# Basta publicar uma release no site (Releases > Draft a new release, etiqueta v1.2.0 etc.).
name: Release
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o pacote do módulo
        run: zip -r trilha-viva.zip module.json README.md scripts styles
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: Trilha Viva ${{ github.event.release.tag_name || github.ref_name }}
          body: |
            Instale pelo manifesto no Foundry:
            https://github.com/Yamavaki/Trilha-Viva/releases/latest/download/module.json
          files: |
            module.json
            trilha-viva.zip
